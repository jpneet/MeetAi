[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-ai-vision-agent"
version = "0.1.0"
description = "Stream Vision Agent powered by Gemini Realtime for Meet AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "vision-agents>=0.6.9",
    "vision-agents-plugins-gemini>=0.6.9",
    "vision-agents-plugins-getstream>=0.6.9",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "edge-tts>=7.2.0",
    "SpeechRecognition>=3.14.0",
    "soundfile>=0.14.0",
    "numpy>=2.0.0",
]

[tool.setuptools]
py-modules = ["main"]
